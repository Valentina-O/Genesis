info:
  name: Registar Usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/registrar"
  body:
    type: json
    data: |-
      {
        "usuario": "admin",
        "correo": "admin@genesis.com",
        "contrasena": "123456"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://localhost:8080/api/v1
    - name: token
      value: ""
  scripts:
    - type: tests
      code: bru.setEnvVar("token", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
