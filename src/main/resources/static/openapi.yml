openapi: 3.0.3
info:
  title: Proyecto Genesis - Backend
  version: 1.0.0
  description: API robusta con gestión de Admin y cálculos financieros/salud.

servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local

security:
  - bearerAuth: []

paths:
  # ========================
  # AUTH
  # ========================
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ========================
  # USUARIO
  # ========================
  /usuario/perfil:
    get:
      tags: [Usuario]
      summary: Ver datos del perfil
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'

  /usuario/historial:
    get:
      tags: [Usuario]
      summary: Historial de transacciones
      responses:
        '200':
          description: Lista de transacciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaccion'

  # ========================
  # OPERACIONES
  # ========================
  /operaciones/credito:
    post:
      tags: [Operaciones]
      summary: Simulación de Crédito
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditoRequest'
      responses:
        '200':
          description: Simulación realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditoResponse'

  # ========================
  # ADMIN
  # ========================
  /admin/metricas:
    get:
      tags: [Admin]
      summary: Ver uso global de la plataforma
      responses:
        '200':
          description: Estadísticas de operaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      properties:
        usuario: { type: string }
        contrasena: { type: string }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        tipo: { type: string, example: "Bearer" }

    PerfilResponse:
      type: object
      properties:
        usuario: { type: string }
        tokens: { type: integer }
        plan: { type: string }

    CreditoRequest:
      type: object
      properties:
        monto: { type: number }
        cuotas: { type: integer }
        tasaMensual: { type: number }

    CreditoResponse:
      type: object
      properties:
        cuotaMensual: { type: number }
        totalIntereses: { type: number }
        totalAPagar: { type: number }

    Transaccion:
      type: object
      properties:
        id: { type: integer }
        operacion: { type: string }
        costoTokens: { type: integer }
        fecha: { type: string, format: date-time }

    MetricasResponse:
      type: object
      properties:
        usuariosTotales: { type: integer }
        operacionMasUsada: { type: string }
        totalTokensConsumidos: { type: integer }ss