openapi: 3.0.3
info:
  title: Proyecto Genesis - Breaze in the Moon
  version: 1.0.0
  description: API completa con autenticación JWT, usuarios, admin y operaciones

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

paths:

  # ========================
  # AUTH
  # ========================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/registrar:
    post:
      tags: [Auth]
      summary: Registrar usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ========================
  # USUARIO
  # ========================
  /usuario/perfil:
    get:
      tags: [Usuario]
      summary: Obtener perfil
      responses:
        '200':
          description: Perfil usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usuario/catalogo:
    get:
      tags: [Usuario]
      summary: Ver catálogo de operaciones
      responses:
        '200':
          description: Lista de operaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operacion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usuario/historial:
    get:
      tags: [Usuario]
      summary: Historial de transacciones
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
        - name: tamaño
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Historial paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usuario/suscripcion:
    post:
      tags: [Usuario]
      summary: Suscribirse a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionRequest'
      responses:
        '200':
          description: Suscripción exitosa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================
  # OPERACIONES
  # ========================
  /operaciones/credito:
    post:
      tags: [Operaciones]
      summary: Calcular crédito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditoRequest'
      responses:
        '200':
          description: Resultado crédito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /operaciones/conversor:
    post:
      tags: [Operaciones]
      summary: Conversor COP/USD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversorRequest'
      responses:
        '200':
          description: Conversión realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /operaciones/imc:
    post:
      tags: [Operaciones]
      summary: Calcular IMC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IMCRequest'
      responses:
        '200':
          description: Resultado IMC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IMCResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /operaciones/sueno:
    post:
      tags: [Operaciones]
      summary: Calcular sueño
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuenoRequest'
      responses:
        '200':
          description: Resultado sueño
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuenoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ========================
  # ADMIN
  # ========================
  /admin/usuarios:
    get:
      tags: [Admin]
      summary: Listar usuarios
      responses:
        '200':
          description: Lista usuarios
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/usuarios/{id}/activar:
    patch:
      tags: [Admin]
      summary: Activar/desactivar usuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado actualizado
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/usuarios/{id}/recargar:
    post:
      tags: [Admin]
      summary: Recargar tokens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tokens:
                  type: integer
      responses:
        '200':
          description: Tokens recargados
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: No autenticado

    Forbidden:
      description: Sin permisos

  schemas:

    LoginRequest:
      type: object
      properties:
        usuario:
          type: string
        contrasena:
          type: string

    RegisterRequest:
      type: object
      properties:
        usuario:
          type: string
        correo:
          type: string
        contrasena:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    PerfilResponse:
      type: object
      properties:
        idUsuario:
          type: integer
        usuario:
          type: string
        correoElectronico:
          type: string
        rolUsuario:
          type: string
        tokensDisponibles:
          type: integer
        planActivo:
          type: string
        estaActivo:
          type: boolean

    SuscripcionRequest:
      type: object
      properties:
        planId:
          type: integer

    HistorialResponse:
      type: object
      properties:
        contenido:
          type: array
          items:
            type: object
        pagina:
          type: integer
        totalPaginas:
          type: integer

    Operacion:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        costoBase:
          type: integer

    CreditoRequest:
      type: object
      properties:
        precio:
          type: number
        cuotas:
          type: integer
        tasaMensual:
          type: number

    CreditoResponse:
      type: object
      properties:
        cuota:
          type: number
        totalPagado:
          type: number
        totalIntereses:
          type: number

    ConversorRequest:
      type: object
      properties:
        monto:
          type: number
        monedaOrigen:
          type: string
        monedaDestino:
          type: string

    ConversorResponse:
      type: object
      properties:
        resultado:
          type: number
        tasa:
          type: number

    IMCRequest:
      type: object
      properties:
        pesoKg:
          type: number
        alturaCm:
          type: number

    IMCResponse:
      type: object
      properties:
        imc:
          type: number
        categoria:
          type: string

    SuenoRequest:
      type: object
      properties:
        modo:
          type: string
        hora:
          type: string
        minutosParaDormir:
          type: integer

    SuenoResponse:
      type: object
      properties:
        opciones:
          type: array
          items:
            type: object

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
        errores:
          type: object
          additionalProperties:
            type: string