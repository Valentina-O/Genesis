openapi: 3.0.3
info:
  title: Proyecto Genesis - Breaze in the Moon
  description: Plataforma de cómputo con trazabilidad de costos mediante tokens.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local de Desarrollo (v1)

# --- SEGURIDAD GLOBAL ---
security:
  - bearerAuth: []

paths:
  # --- AUTENTICACIÓN ---
  /auth/registrar:
    post:
      summary: "Registrar un nuevo usuario"
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistro'
      responses:
        '201':
          description: Usuario creado con éxito.
        '400':
          $ref: '#/components/responses/ErrorValidacion'

  /auth/login:
    post:
      summary: "Iniciar sesión"
      tags: [Autenticación]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudLogin'
      responses:
        '200':
          description: Login exitoso.

  # --- USUARIO ---
  /usuario/perfil:
    get:
      summary: "Consultar perfil del usuario actual"
      tags: [Usuario]
      responses:
        '200':
          description: Datos del perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'

  /usuario/historial:
    get:
      summary: "Consultar historial de transacciones"
      tags: [Usuario]
      parameters:
        - name: pagina
          in: query
          schema: { type: integer, default: 0 }
        - name: tamano
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Lista de transacciones.

  /usuario/catalogo:
    get:
      summary: "Ver catálogo de operaciones"
      tags: [Usuario]
      responses:
        '200':
          description: Lista de operaciones activas.

  /usuario/suscripcion:
    post:
      summary: "Suscribirse a un plan de tokens"
      tags: [Usuario]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSuscripcion'
      responses:
        '200':
          description: Suscripción exitosa.

  # --- OPERACIONES ---
  /operaciones/credito:
    post:
      summary: "Cálculo de Crédito"
      tags: [Operaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditoSolicitud'
      responses:
        '200':
          description: Cálculo exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditoRespuesta'

  /operaciones/imc:
    post:
      summary: "Calculadora de IMC"
      tags: [Operaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IMCSolicitud'
      responses:
        '200':
          description: Resultado exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IMCRespuesta'

  /operaciones/sueno:
    post:
      summary: "Calculadora de Sueño"
      tags: [Operaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSueno'
      responses:
        '200':
          description: Horarios calculados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSueno'

  /operaciones/moneda:
    post:
      summary: "Conversor de Moneda"
      tags: [Operaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversorSolicitud'
      responses:
        '200':
          description: Conversión realizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversorRespuesta'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorValidacion:
      description: "Error en los datos de entrada"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'

  schemas:
    # --- AUTH & USER ---
    SolicitudRegistro:
      type: object
      required: [usuario, correo, contrasena]
      properties:
        usuario: { type: string, example: "valentina" }
        correo: { type: string, example: "vale@correo.com" }
        contrasena: { type: string, example: "123456" }

    SolicitudLogin:
      type: object
      required: [usuario, contrasena]
      properties:
        usuario: { type: string, example: "valentina" }
        contrasena: { type: string, example: "123456" }

    UsuarioPerfil:
      type: object
      properties:
        usuario: { type: string }
        tokensDisponibles: { type: integer }
        planActivo: { type: string }
        rolUsuario: { type: string, enum: [USER, ADMIN] }

    SolicitudSuscripcion:
      type: object
      required: [planId]
      properties:
        planId: { type: integer, example: 1 }

    ErrorRespuesta:
      type: object
      properties:
        codigo: { type: integer }
        mensaje: { type: string }
        timestamp: { type: string, format: "date-time" }

    # --- OPERACIÓN: IMC ---
    IMCSolicitud:
      type: object
      required: [pesoKg, alturaCm]
      properties:
        pesoKg: { type: number, example: 70.5 }
        alturaCm: { type: number, example: 175.0 }

    IMCRespuesta:
      type: object
      properties:
        imc: { type: number }
        categoria: { type: string }
        tokensConsumidos: { type: integer }

    # --- OPERACIÓN: CRÉDITO ---
    CreditoSolicitud:
      type: object
      required: [precio, cuotas, tasaMensual]
      properties:
        precio: { type: number, example: 5000000 }
        cuotas: { type: integer, example: 12 }
        tasaMensual: { type: number, example: 1.5 }

    CreditoRespuesta:
      type: object
      properties:
        cuotaMensual: { type: number }
        totalPagado: { type: number }
        tokensConsumidos: { type: integer }

    # --- OPERACIÓN: SUEÑO ---
    SolicitudSueno:
      type: object
      required: [modo, hora]
      properties:
        modo: { type: string, enum: [HORA_DESPERTAR, HORA_ACOSTARSE] }
        hora: { type: string, example: "22:30" }

    RespuestaSueno:
      type: object
      properties:
        opciones:
          type: array
          items:
            type: object
            properties:
              ciclos: { type: integer }
              horaCalculada: { type: string }
        tokensConsumidos: { type: integer }

    # --- OPERACIÓN: MONEDA ---
    ConversorSolicitud:
      type: object
      required: [monto, monedaOrigen, tasaSugerida]
      properties:
        monto: { type: number, example: 100.0 }
        monedaOrigen: { type: string, example: "USD" }
        tasaSugerida: { type: number, example: 3950.0 }

    ConversorRespuesta:
      type: object
      properties:
        montoConvertido: { type: number }
        tokensConsumidos: { type: integer }